name: Unpack source (one-time)

on:
  push:
    paths: ['.github/workflows/unpack.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy source from transfer branch
        run: |
          git clone --depth 1 --branch safe-side-transfer https://github.com/Niklauren/Ultimate-Trance-Gate.git /tmp/src
          rm -rf /tmp/src/.git
          cp -R /tmp/src/. .
          git config user.name "BOBA"
          git config user.email "Niklauren@users.noreply.github.com"
          git add -A
          git commit -m "SAFE-SIDE 2.0.0 by BOBA: plug-in source, installers, docs, tests"
          git push
