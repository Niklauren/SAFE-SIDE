name: Unpack source (one-time)

on:
  push:
    paths: ['safe-side-src.zip']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack and commit
        run: |
          test -f safe-side-src.zip || exit 0
          unzip -o safe-side-src.zip
          rm safe-side-src.zip
          git config user.name "BOBA"
          git config user.email "Niklauren@users.noreply.github.com"
          git add -A
          git commit -m "SAFE-SIDE 2.0.0 by BOBA: plug-in source, installers, docs, tests"
          git push
